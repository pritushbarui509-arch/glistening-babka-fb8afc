[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

[functions.dashboard]
  included_files = ["private/dashboard.html"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
